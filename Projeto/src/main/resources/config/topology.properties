# Grafo permitido local; bootstrap B não é um nó de encaminhamento.
node.ids=S1,S2,R1,C1

node.S1.host=127.0.0.1
node.S1.controlPort=5100
node.S1.dataPort=5101
node.S1.role=SERVER
node.S1.neighbors=S2,R1

node.S2.host=127.0.0.1
node.S2.controlPort=5200
node.S2.dataPort=5201
node.S2.role=SERVER
